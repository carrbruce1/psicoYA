<div class="login-container">
  <div class="login-card">
    <div class="brand-header">
      <div class="logo">Ψ</div>
      <h1>Mind<span>Desk</span></h1>
      <p>{{ isLoginMode ? 'Inicia sesión en tu cuenta' : 'Registra tu cuenta profesional' }}</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group" *ngIf="!isLoginMode">
        <label for="nombre">Nombre Completo</label>
        <input id="nombre" type="text" [(ngModel)]="nombre" name="nombre" placeholder="Dra. Ana Gómez" required />
      </div>

      <div class="form-group" *ngIf="!isLoginMode">
        <label for="matricula">Matrícula Profesional</label>
        <input id="matricula" type="text" [(ngModel)]="matricula" name="matricula" placeholder="MP 12345" required />
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="correo@ejemplo.com" required />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required />
      </div>

      <div class="success-alert" role="status" *ngIf="successMessage">{{ successMessage }}</div>
      <div class="error-alert" role="alert" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn-submit" [disabled]="loading">
        {{ loading ? 'Procesando...' : (isLoginMode ? 'Entrar al Sistema' : 'Registrarse') }}
      </button>
    </form>

    <div class="toggle-mode">
      <p>
        {{ isLoginMode ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?' }}
        <span (click)="toggleMode()">{{ isLoginMode ? 'Regístrate aquí' : 'Inicia sesión' }}</span>
      </p>
    </div>
  </div>
</div>
